<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WeDo 2.0 Bluetooth Test</title><style>body{font:16px system-ui;background:#101b2e;color:#fff;margin:0;padding:24px}main{max-width:520px;margin:auto}button{font:inherit;background:#4f91ff;color:white;border:0;border-radius:12px;padding:16px;width:100%;margin:8px 0}button:disabled{opacity:.4}.panel{background:#20314a;border-radius:14px;padding:18px;margin:18px 0}#log{white-space:pre-wrap;overflow-wrap:anywhere;font:13px ui-monospace,monospace;color:#c8d7ed}small{color:#b7c9de}</style></head><body><main><h1>WeDo 2.0</h1><p>Bluetooth connection test · Version 1</p><div class="panel"><strong id="status">Not connected</strong><p id="device">No hub selected</p></div><button id="connect">Find & Connect Smart Hub</button><button id="disconnect" disabled>Disconnect</button><div class="panel"><strong>Connection log</strong><p id="log">Ready. Tap Find & Connect.</p></div><small>This test does not send motor or LED commands. Open this page in Bluefy over HTTPS, not as a local file. Bluetooth permissions may be requested.</small></main><script>
const SERVICE='00001523-1212-efde-1523-785feabcd123';const IO='00004f0e-1212-efde-1523-785feabcd123';let hub=null;const $=id=>document.getElementById(id);function log(s){$('log').textContent+='\n'+s}function state(s){$('status').textContent=s}function disconnected(){state('Disconnected');$('disconnect').disabled=true;log('Hub disconnected')}
$('connect').onclick=async()=>{if(!navigator.bluetooth){state('Bluetooth API unavailable');log('This browser does not expose Web Bluetooth. Open the hosted HTTPS page in Bluefy.');return}try{state('Looking for hub…');log('Opening Bluetooth device picker');hub=await navigator.bluetooth.requestDevice({filters:[{services:[SERVICE]}],optionalServices:[IO,'battery_service']});$('device').textContent=hub.name||'Unnamed WeDo hub';hub.addEventListener('gattserverdisconnected',disconnected);state('Connecting…');const server=await hub.gatt.connect();log('GATT connected');const svc=await server.getPrimaryService(SERVICE);log('WeDo hub service found: '+svc.uuid);try{const io=await server.getPrimaryService(IO);log('I/O service found: '+io.uuid)}catch(e){log('I/O service not accessible: '+e.message)}state('Connected successfully');$('disconnect').disabled=false}catch(e){state('Connection failed');log((e.name||'Error')+': '+e.message)}};
$('disconnect').onclick=()=>{if(hub?.gatt?.connected)hub.gatt.disconnect()};
</script></body></html>
